[package]
name = "opendaw-engine"
version = "0.0.1"
edition = "2021"

[workspace]

[dependencies]
v8 = "152"
cpal = "0.18"
rtrb = "0.4"
audio_thread_priority = "0.38"
tungstenite = "0.30"
midir = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vst3 = "0.3"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSResponder", "NSRunningApplication", "NSGraphics", "NSEvent", "NSWorkspace", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
libc = "0.2"

[profile.release]
strip = true
