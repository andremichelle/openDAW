[package]
name = "opendaw"
version = "0.0.1"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tiny_http = "0.12"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
url = "2"
getrandom = "0.3"
ureq = { version = "2", features = ["json", "brotli"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSEvent", "NSApplication", "block2"] }
objc2 = "0.6"
block2 = "0.6"
