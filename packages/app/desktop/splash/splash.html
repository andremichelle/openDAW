<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>openDAW</title>
<style>
    @font-face { font-family: Rubik; font-weight: 300; src: url("/__splash/rubik-300.woff2") format("woff2"); }
    @font-face { font-family: Rubik; font-weight: 400; src: url("/__splash/rubik-400.woff2") format("woff2"); }
    :root {
        --background: hsl(200, 9%, 9%);
        --surface: hsl(200, 9%, 14%);
        --track: hsl(200, 9%, 18%);
        --text: hsl(200, 6%, 86%);
        --dim: hsl(200, 6%, 52%);
        --accent: hsl(197, 90%, 62%);
    }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
        background: var(--background); color: var(--dim);
        font: 400 12px Rubik, system-ui, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        user-select: none; -webkit-user-select: none; cursor: default;
    }
    main { display: flex; flex-direction: column; align-items: center; gap: 28px; animation: appear 0.6s ease-out both; }
    .brand { display: flex; align-items: center; gap: 18px; }
    .brand svg { width: 52px; height: 52px; }
    .brand h1 { margin: 0; color: var(--text); font-weight: 300; font-size: 44px; letter-spacing: 0.02em; }
    .progress { width: 280px; display: flex; flex-direction: column; gap: 10px; }
    .bar { position: relative; height: 2px; background: var(--track); border-radius: 1px; overflow: hidden; }
    .bar > .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); transition: width 0.25s ease-out; }
    .bar.indeterminate > .fill { width: 30%; animation: sweep 1.2s ease-in-out infinite; }
    .status { display: flex; justify-content: space-between; gap: 16px; min-height: 15px; white-space: nowrap; align-self: center; width: max-content; min-width: 100%; }
    .status .amount { font-variant-numeric: tabular-nums; }
    .actions { display: flex; gap: 8px; min-height: 26px; }
    button {
        background: var(--surface); color: var(--text); border: none; border-radius: 3px;
        padding: 6px 14px; font: inherit; cursor: pointer;
    }
    button:hover { background: var(--track); }
    footer { position: absolute; bottom: 18px; font-size: 11px; color: hsl(200, 6%, 34%); }
    .error { color: hsl(10, 70%, 64%); }
    .choice { width: 360px; display: flex; flex-direction: column; gap: 10px; }
    .choice label { display: grid; grid-template-columns: 18px 1fr auto; column-gap: 10px; align-items: start; cursor: pointer; }
    .choice label.required { cursor: default; }
    .choice input { margin: 2px 0 0 0; accent-color: var(--accent); }
    .choice .name { color: var(--text); }
    .choice .description { grid-column: 2; font-size: 11px; }
    .choice .amount { font-variant-numeric: tabular-nums; }
    .choice .total { display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--track); color: var(--text); }
    .hidden { display: none; }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<main>
    <div class="brand">{LOGO}<h1>openDAW</h1></div>
    <div class="progress">
        <div class="bar indeterminate" id="bar"><div class="fill" id="fill"></div></div>
        <div class="status"><span id="message">Starting</span><span class="amount" id="amount"></span></div>
    </div>
    <div class="choice hidden" id="choice"></div>
    <div class="actions">
        <button id="skip" class="hidden">Skip Update</button>
        <button id="retry" class="hidden">Retry</button>
        <button id="install" class="hidden">Install</button>
    </div>
</main>
<footer>Desktop {VERSION}</footer>
<script>
    const element = id => document.getElementById(id)
    const bar = element("bar"), fill = element("fill"), message = element("message"), amount = element("amount")
    const skip = element("skip"), retry = element("retry"), install = element("install"), choice = element("choice")
    const progressBox = document.querySelector(".progress")
    skip.onclick = () => fetch("/__update/skip")
    retry.onclick = () => fetch("/__update/retry")
    const megabytes = bytes => (bytes / 1048576).toFixed(1)
    const state = {choiceShown: false}
    const showChoice = status => {
        state.choiceShown = true
        const row = (name, description, size, checked, required) => `<label class="${required ? "required" : ""}">
            <input type="checkbox" ${checked ? "checked" : ""} ${required ? "disabled" : ""} data-size="${size}" data-name="${name}">
            <span class="name">${name === "" ? "Studio" : description[0]}</span><span class="amount">${megabytes(size)} MB</span>
            <span class="description">${description[1]}</span></label>`
        choice.innerHTML = row("", ["Studio", "Required"], status.core, true, true)
            + status.components.map(component => row(component.name, [component.label, component.description], component.size, component.selected, false)).join("")
            + `<div class="total"><span>Download</span><span class="amount" id="total"></span></div>`
        const boxes = Array.from(choice.querySelectorAll("input"))
        const updateTotal = () => element("total").textContent =
            `${megabytes(boxes.filter(box => box.checked).reduce((sum, box) => sum + Number(box.dataset.size), 0))} MB`
        boxes.forEach(box => box.onchange = updateTotal)
        updateTotal()
        install.onclick = () => {
            const selected = boxes.filter(box => box.checked && box.dataset.name !== "").map(box => box.dataset.name)
            state.chosen = true
            install.classList.add("hidden")
            fetch(`/__update/choose?selected=${selected.join(",")}`)
        }
    }
    const poll = async () => {
        const status = await fetch("/__update/status").then(response => response.json()).catch(() => null)
        if (status !== null) {
            if (status.phase === "ready") {
                message.textContent = "Starting"
                return location.replace("/")
            }
            const choosing = status.phase === "choose"
            if (choosing && !state.choiceShown) {
                showChoice(status)
                choice.classList.remove("hidden")
                install.classList.remove("hidden")
                progressBox.classList.add("hidden")
            } else if (!choosing && state.choiceShown && !state.choiceDone) {
                state.choiceDone = true
                choice.classList.add("hidden")
                install.classList.add("hidden")
                progressBox.classList.remove("hidden")
            }
            const downloading = status.phase === "downloading" && status.total > 0
            const failed = status.phase === "offline" || status.phase === "error"
            message.textContent = status.message
            message.classList.toggle("error", failed)
            amount.textContent = downloading ? `${megabytes(status.done)} / ${megabytes(status.total)} MB` : ""
            bar.classList.toggle("indeterminate", status.phase === "checking")
            bar.classList.toggle("hidden", failed)
            fill.style.width = downloading ? `${100 * status.done / status.total}%` : ""
            skip.classList.toggle("hidden", !(status.phase === "downloading" && status.installed))
            retry.classList.toggle("hidden", !failed)
        }
        setTimeout(poll, 150)
    }
    poll()
</script>
</body>
</html>
