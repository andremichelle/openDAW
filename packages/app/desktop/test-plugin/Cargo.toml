[package]
name = "opendaw-test-plugin"
version = "0.0.1"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
vst3 = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSEvent", "NSColor", "NSGraphics"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
