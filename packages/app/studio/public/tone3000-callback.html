<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TONE3000</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background: #1a1a1a; color: #ccc; }
        p { font-size: 1.2em; }
    </style>
</head>
<body>
<p id="status">Receiving tone...</p>
<script>
    const status = document.getElementById("status")
    const params = new URLSearchParams(window.location.search)
    const channel = new BroadcastChannel("tone3000-callback")
    window.onbeforeunload = () => channel.postMessage({type: "closed"})
    const message = {
        type: "callback",
        code: params.get("code"),
        state: params.get("state"),
        toneId: params.get("tone_id"),
        canceled: params.get("canceled") === "true",
        error: params.get("error"),
        errorDescription: params.get("error_description")
    }
    let failed = false
    if (message.canceled) {
        status.textContent = "Canceled."
    } else if (message.error !== null) {
        failed = true
        status.textContent = `Error: ${message.error}${message.errorDescription ? ` — ${message.errorDescription}` : ""}`
    } else if (message.code === null || message.toneId === null) {
        failed = true
        status.textContent = "Error: No tone selected."
    } else {
        status.textContent = "Sending NAM to device..."
    }
    window.onbeforeunload = null
    // opened in the system browser by the desktop app, which forwards the message to the studio
    if (location.origin === "http://127.0.0.1:47110" && window.opener === null) {
        channel.close()
        fetch("/__auth-callback?channel=tone3000-callback", {method: "POST", body: JSON.stringify(message)})
            .then(response => {
                if (!response.ok) {throw new Error(`status ${response.status}`)}
                if (!failed && !message.canceled) {status.textContent = "Tone sent. You can close this tab and return to openDAW."}
            })
            .catch(error => {status.textContent = `Error: ${error}`})
    } else {
        channel.postMessage(message)
        channel.close()
        if (!failed) {window.close()}
    }
</script>
</body>
</html>
