# .github/workflows/desktop.yml
name: Build openDAW desktop app

# A tag desktop-v<version> builds macOS, Windows and Linux and publishes them as the latest GitHub Release
# (the /install page links the files). A tag desktop-test-<n> or a manual run only builds and keeps the files as
# workflow artifacts for testers, no release.
on:
  push:
    tags: ["desktop-v*", "desktop-test-*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # the server the app installs and updates the studio from, DEV until the public release
  OPENDAW_UPDATE_ORIGIN: https://dev.opendaw.studio

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            bundles: app,dmg # the dmg alone removes the .app the architecture check reads
            arch: arm64
          - platform: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            bundles: app,dmg
            arch: x86_64
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🐧 Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libdbus-1-dev patchelf file

      - name: 🦀 Install Rust targets
        run: rustup target add ${{ matrix.rust-targets }}

      - name: 📦 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/desktop
          key: ${{ matrix.platform }}

      - name: 🔧 Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: 🏷️ Check version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          version=$(node -p "require('./packages/app/desktop/tauri.conf.json').version")
          if [ "desktop-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      # a test build is version 0.0.<n>, so the updater of an installed app takes it (plans/shell-updates.md)
      - name: 🏗️ Build
        working-directory: packages/app/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          config='{"bundle": {"createUpdaterArtifacts": true}}'
          case "$GITHUB_REF_NAME" in
            desktop-test-*) config="{\"version\": \"0.0.${GITHUB_REF_NAME#desktop-test-}\", \"bundle\": {\"createUpdaterArtifacts\": true}}" ;;
          esac
          echo "$config"
          cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$config"

      - name: 🔍 Check the architecture
        if: startsWith(matrix.platform, 'macos')
        working-directory: packages/app/desktop/target/${{ matrix.target }}/release/bundle/macos
        run: |
          for binary in "openDAW Studio.app/Contents/MacOS/"*; do
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            if [ "$archs" != "${{ matrix.arch }}" ]; then
              echo "expected ${{ matrix.arch }} only"
              exit 1
            fi
          done

      - name: 📁 Collect
        working-directory: packages/app/desktop/target/${{ matrix.target }}/release/bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # each installer, and the file the updater downloads with its signature (.sig)
          take() { cp $1 "$GITHUB_WORKSPACE/dist/$2"; if ls $1.sig > /dev/null 2>&1; then cp $1.sig "$GITHUB_WORKSPACE/dist/$2.sig"; fi; }
          case "${{ matrix.platform }}" in
            macos-arm64)
              take "dmg/*.dmg" openDAW-macos-arm64.dmg
              take "macos/*.app.tar.gz" openDAW-macos-arm64.app.tar.gz ;;
            macos-intel)
              take "dmg/*.dmg" openDAW-macos-intel.dmg
              take "macos/*.app.tar.gz" openDAW-macos-intel.app.tar.gz ;;
            windows) take "nsis/*.exe" openDAW-windows-setup.exe ;;
            linux)
              take "appimage/*.AppImage" openDAW-linux.AppImage
              take "deb/*.deb" openDAW-linux.deb ;;
            linux-arm64)
              take "appimage/*.AppImage" openDAW-linux-arm64.AppImage
              take "deb/*.deb" openDAW-linux-arm64.deb ;;
          esac
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: 📤 Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openDAW-${{ matrix.platform }}
          path: dist/*
          retention-days: 14

  # a test build replaces the installers on dev.opendaw.studio/install (the studio's download page links them)
  install:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-test-')
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: ⬇️ Collect the builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # the updater's feed: version and per platform the signed file, a release never goes out half signed
      - name: 📝 Write openDAW-latest.json
        run: |
          node packages/app/desktop/scripts/latest-json.mjs dist "0.0.${GITHUB_REF_NAME#desktop-test-}" "$OPENDAW_UPDATE_ORIGIN/install"
          cat dist/openDAW-latest.json

      - name: 🚚 Upload to dev.opendaw.studio/install
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "set sftp:auto-confirm yes; mkdir -p -f /dev/install; mirror -R --overwrite --delete dist /dev/install; bye" \
            -u "$SFTP_USERNAME" --env-password -p "$SFTP_PORT" "sftp://$SFTP_HOST"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: ⬇️ Collect the builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # the updater's feed points at this release's files
      - name: 📝 Write openDAW-latest.json
        run: |
          node packages/app/desktop/scripts/latest-json.mjs dist "${GITHUB_REF_NAME#desktop-v}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          cat dist/openDAW-latest.json

      - name: 🚀 Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --latest \
            --title "openDAW Desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes "macOS, Windows and Linux. The app installs and updates the studio from $OPENDAW_UPDATE_ORIGIN on first launch. Download page: https://opendaw.studio/install"

      # installed apps read the feed from their update origin (dev.opendaw.studio/install or opendaw.studio/install)
      - name: 🚚 Publish the feed
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          case "$OPENDAW_UPDATE_ORIGIN" in
            https://dev.opendaw.studio) folder=/dev/install ;;
            https://opendaw.studio) folder=/main/install ;;
            *) echo "no install folder for $OPENDAW_UPDATE_ORIGIN"; exit 1 ;;
          esac
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "set sftp:auto-confirm yes; mkdir -p -f $folder; put -O $folder dist/openDAW-latest.json; bye" \
            -u "$SFTP_USERNAME" --env-password -p "$SFTP_PORT" "sftp://$SFTP_HOST"
