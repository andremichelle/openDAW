# .github/workflows/desktop.yml
name: Build openDAW desktop app

# A tag desktop-v<version> builds macOS, Windows and Linux and publishes them as the latest GitHub Release
# (the /download page links the files). A tag desktop-test-<n> or a manual run only builds and keeps the files as
# workflow artifacts for testers, no release.
on:
  push:
    tags: ["desktop-v*", "desktop-test-*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # the server the app installs and updates the studio from, DEV until the public release
  OPENDAW_UPDATE_ORIGIN: https://dev.opendaw.studio

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            bundles: dmg
            arch: arm64
          - platform: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            bundles: dmg
            arch: x86_64
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🐧 Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libdbus-1-dev patchelf file

      - name: 🦀 Install Rust targets
        run: rustup target add ${{ matrix.rust-targets }}

      - name: 📦 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/desktop
            packages/app/desktop/engine
          key: ${{ matrix.platform }}

      - name: 🔧 Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: 🏷️ Check version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          version=$(node -p "require('./packages/app/desktop/tauri.conf.json').version")
          if [ "desktop-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - name: 🏗️ Build
        working-directory: packages/app/desktop
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 🔍 Check the architecture
        if: startsWith(matrix.platform, 'macos')
        working-directory: packages/app/desktop/target/${{ matrix.target }}/release/bundle/macos
        run: |
          for binary in "openDAW Studio.app/Contents/MacOS/"*; do
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            if [ "$archs" != "${{ matrix.arch }}" ]; then
              echo "expected ${{ matrix.arch }} only"
              exit 1
            fi
          done

      - name: 📁 Collect
        working-directory: packages/app/desktop/target/${{ matrix.target }}/release/bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          case "${{ matrix.platform }}" in
            macos-arm64) cp dmg/*.dmg "$GITHUB_WORKSPACE/dist/openDAW-macos-arm64.dmg" ;;
            macos-intel) cp dmg/*.dmg "$GITHUB_WORKSPACE/dist/openDAW-macos-intel.dmg" ;;
            windows) cp nsis/*.exe "$GITHUB_WORKSPACE/dist/openDAW-windows-setup.exe" ;;
            linux)
              cp appimage/*.AppImage "$GITHUB_WORKSPACE/dist/openDAW-linux.AppImage"
              cp deb/*.deb "$GITHUB_WORKSPACE/dist/openDAW-linux.deb" ;;
          esac
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: 📤 Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openDAW-${{ matrix.platform }}
          path: dist/*
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Collect the builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 🚀 Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --latest \
            --title "openDAW Desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes "macOS, Windows and Linux. The app installs and updates the studio from $OPENDAW_UPDATE_ORIGIN on first launch. Download page: https://opendaw.studio/download"
