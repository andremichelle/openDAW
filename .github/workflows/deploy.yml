# .github/workflows/deploy.yml
name: Deploy openDAW studio

on:
  workflow_dispatch:
    inputs:
      to_dev:
        description: "Deploy this branch to DEV (dev.opendaw.studio), e.g. to mirror main"
        required: false
        default: false
        type: boolean

env:
  DEPLOY_ENV: ${{ inputs.to_dev && 'dev' || '' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: ⬇️ Checkout main repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🦄 Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 🦀 Install Rust + wasm target + binaryen
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain nightly
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y binaryen

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⭐ Fetch sponsors via GraphQL
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: node scripts/fetch-sponsors.mjs

      - name: 🏗️ Build project
        shell: bash
        env:
          CI: true
          BRANCH_NAME: ${{ github.ref_name }}
          VITE_WCLAP_ORIGIN: https://opendaw-plugins.studio
        run: |
          npm run build

      - name: 🗺️ Read the build uuid
        id: build-info
        run: echo "uuid=$(node -p "require('./packages/app/studio/public/build-info.json').uuid")" >> "$GITHUB_OUTPUT"

      - name: 🗺️ Keep the engine symbol map (not deployed)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: engine-symbols-${{ steps.build-info.outputs.uuid }}
          path: crates/target/wasm32-unknown-unknown/release/engine.symbols
          retention-days: 90
          if-no-files-found: warn

      - name: 🚚 Run deploy script
        env:
          TERM: xterm-256color
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          npx ts-node --transpile-only deploy/run.ts