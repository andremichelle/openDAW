# .github/workflows/deploy.yml
name: Deploy openDAW studio

on:
  workflow_dispatch:
    inputs:
      to_dev:
        description: "Deploy this branch to DEV (dev.opendaw.studio), e.g. to mirror main"
        required: false
        default: false
        type: boolean

env:
  DEPLOY_ENV: ${{ inputs.to_dev && 'dev' || '' }}

jobs:
  # The desktop release carries the native engine for every installer platform, so an engine change ships with the
  # deploy and needs no new installer (plans/engine-updates.md). DEV only, like the desktop variant.
  engines:
    if: ${{ inputs.to_dev || github.ref_name != 'main' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🐧 Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libdbus-1-dev patchelf file

      - name: 🦀 Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: 📦 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/desktop/engine
          key: engine-${{ matrix.platform }}

      - name: 🏗️ Build the engine
        working-directory: packages/app/desktop/engine
        run: |
          cargo build --release --target ${{ matrix.target }}
          suffix=""
          case "${{ matrix.platform }}" in windows) suffix=".exe" ;; esac
          mkdir -p "$GITHUB_WORKSPACE/engine"
          cp "target/${{ matrix.target }}/release/opendaw-engine$suffix" "$GITHUB_WORKSPACE/engine/"

      - name: ✍️ Sign (ad hoc)
        if: startsWith(matrix.platform, 'macos')
        run: codesign --force --sign - "$GITHUB_WORKSPACE/engine/opendaw-engine"

      - name: 📤 Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: engine/*
          retention-days: 3

  build-and-deploy:
    needs: engines
    # runs when the engines were built, or skipped for a PROD deploy
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: ⬇️ Checkout main repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🦄 Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 🦀 Install Rust + wasm target + binaryen
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain nightly
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y binaryen

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⭐ Fetch sponsors via GraphQL
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: node scripts/fetch-sponsors.mjs

      - name: 🏗️ Build project
        shell: bash
        env:
          CI: true
          BRANCH_NAME: ${{ github.ref_name }}
          VITE_WCLAP_ORIGIN: https://opendaw-plugins.studio
        run: |
          npm run build

      - name: ⬇️ Collect the engines (DEV only)
        if: ${{ inputs.to_dev || github.ref_name != 'main' }}
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: packages/app/desktop/engine/dist

      - name: 🖥️ Build desktop variant (DEV only)
        if: ${{ inputs.to_dev || github.ref_name != 'main' }}
        shell: bash
        env:
          CI: true
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # engine/dist/engine-<platform>/ becomes the release's engine/<platform>/
          cd packages/app/desktop/engine/dist
          for folder in engine-*; do mv "$folder" "${folder#engine-}"; done
          for platform in macos-arm64 macos-intel windows linux linux-arm64; do
            ls "$platform"/opendaw-engine* > /dev/null || { echo "the $platform engine is missing"; exit 1; }
          done
          cd "$GITHUB_WORKSPACE"
          sh packages/app/desktop/devices/build.sh
          npm run build:desktop

      - name: 🚚 Run deploy script
        env:
          TERM: xterm-256color
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          npx ts-node --transpile-only deploy/run.ts