[package]
name = "surgeon-lab"
version = "0.0.0"
edition = "2021"
publish = false

# dev only: prototype voice and A/B renders for Surgeon (plans/surgeon.md), never built for the browser
# a workspace member through device-surgeon's dev-dependency. hit_envelope.rs and svf.rs are copies of the
# openDrum dsp blocks until those land in `dsp`
[lib]
crate-type = ["lib"]

[dependencies]
dsp = {path = "../dsp"}
libm = "0.2"
