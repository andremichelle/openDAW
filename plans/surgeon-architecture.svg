  <circle cx="302" cy="663" r="4.4" fill="#ffb347"/>
  <circle cx="342" cy="663" r="3.2" fill="#ffe66d"/>
  <circle cx="382" cy="663" r="1.2" fill="#4a5361"/>
  <text x="76" y="680" fill="#c8d0db" font-size="12">Fold</text>
  <circle cx="262" cy="676" r="1.2" fill="#4a5361"/>
  <circle cx="302" cy="676" r="1.2" fill="#4a5361"/>
  <circle cx="342" cy="676" r="4.8" fill="#ffe66d"/>
  <circle cx="382" cy="676" r="1.2" fill="#4a5361"/>
  <text x="76" y="693" fill="#c8d0db" font-size="12">Length</text>
  <circle cx="262" cy="689" r="4.0" fill="#ff6b6b"/>
  <circle cx="302" cy="689" r="1.2" fill="#4a5361"/>
  <circle cx="342" cy="689" r="1.2" fill="#4a5361"/>
  <circle cx="382" cy="689" r="3.6" fill="#6bd490"/>
  <text x="76" y="706" fill="#c8d0db" font-size="12">Ratio</text>
  <circle cx="262" cy="702" r="1.2" fill="#4a5361"/>
  <circle cx="302" cy="702" r="1.2" fill="#4a5361"/>
  <circle cx="342" cy="702" r="1.2" fill="#4a5361"/>
  <circle cx="382" cy="702" r="4.5" fill="none" stroke="#6bd490" stroke-width="1.5"/>
  <text x="76" y="719" fill="#c8d0db" font-size="12">Modulator 2 depth</text>
  <circle cx="262" cy="715" r="1.2" fill="#4a5361"/>
  <circle cx="302" cy="715" r="4.0" fill="#ffb347"/>
  <circle cx="342" cy="715" r="1.2" fill="#4a5361"/>
  <circle cx="382" cy="715" r="1.2" fill="#4a5361"/>

  <path d="M420 480H498" stroke="#9aa4b2" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="460" y="456" fill="#9aa4b2" font-size="12" text-anchor="middle">lane</text>
  <text x="460" y="470" fill="#9aa4b2" font-size="12" text-anchor="middle">values</text>

  <rect x="500" y="126" width="740" height="452" rx="10" fill="#1b1f26" stroke="#3a4250"/>
  <text x="520" y="152" fill="#f2f4f7" font-size="15" font-weight="600">VOICE</text>
  <text x="578" y="152" fill="#9aa4b2" font-size="13">monophonic, tied steps slide to the next pitch</text>

  <path d="M420 224H498" stroke="#9aa4b2" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="460" y="186" fill="#9aa4b2" font-size="12" text-anchor="middle">pitch</text>
  <text x="460" y="200" fill="#9aa4b2" font-size="12" text-anchor="middle">velocity</text>
  <text x="460" y="214" fill="#9aa4b2" font-size="12" text-anchor="middle">tie</text>

  <g font-size="14">
    <rect x="530" y="184" width="180" height="78" rx="8" fill="#232831" stroke="#3a4250"/>
    <text x="546" y="210" fill="#f2f4f7" font-weight="600">Modulator 1</text>
