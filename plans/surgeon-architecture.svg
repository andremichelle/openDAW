<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa4b2"/>
    </marker>
  </defs>
  <rect width="1280" height="780" fill="#14171c"/>
  <text x="40" y="46" fill="#f2f4f7" font-size="22" font-weight="600">Surgeon</text>
  <text x="180" y="46" fill="#9aa4b2" font-size="14">one instrument: a loop that plays its own voice (plan state 2026-11-13)</text>

  <g>
    <g fill="#232831" stroke="#3a4250">
      <rect x="40" y="70" width="26" height="26" rx="4" fill="#5bc0eb" stroke="#5bc0eb"/>
      <rect x="72" y="70" width="26" height="26" rx="4"/>
      <rect x="104" y="70" width="26" height="26" rx="4"/>
      <rect x="136" y="70" width="26" height="26" rx="4"/>
      <rect x="168" y="70" width="26" height="26" rx="4"/>
      <rect x="200" y="70" width="26" height="26" rx="4"/>
      <rect x="232" y="70" width="26" height="26" rx="4"/>
      <rect x="264" y="70" width="26" height="26" rx="4"/>
    </g>
    <rect x="304" y="70" width="44" height="26" rx="4" fill="#232831" stroke="#3a4250"/>
    <text x="326" y="88" fill="#c8d0db" font-size="12" text-anchor="middle">Off</text>
    <text x="364" y="82" fill="#f2f4f7" font-size="14" font-weight="600">8 patterns and Off, switched on the bar</text>
    <text x="364" y="99" fill="#9aa4b2" font-size="13">plays with the transport, a pattern stores a loop together with its sound</text>
  </g>

  <rect x="40" y="126" width="400" height="614" rx="10" fill="#1b1f26" stroke="#3a4250"/>
  <text x="60" y="152" fill="#f2f4f7" font-size="15" font-weight="600">LOOP</text>
  <text x="112" y="152" fill="#9aa4b2" font-size="13">computed from the song position, replays on locate</text>

  <rect x="60" y="168" width="360" height="112" rx="8" fill="#232831" stroke="#5bc0eb"/>
  <text x="76" y="192" fill="#f2f4f7" font-size="15" font-weight="600">Note loop</text>
  <text x="76" y="214" fill="#c8d0db" font-size="13">Seed · Steps 1 to 32 · Rate · Mutate</text>
  <text x="76" y="234" fill="#c8d0db" font-size="13">Range · Density · Tie · Accent</text>
  <text x="76" y="262" fill="#9aa4b2" font-size="13">free pitch, never quantised to notes or scales</text>

  <text x="60" y="308" fill="#f2f4f7" font-size="14" font-weight="600">Lanes</text>
  <text x="112" y="308" fill="#9aa4b2" font-size="13">four, generic and interchangeable</text>

  <g font-size="14">
    <rect x="60" y="322" width="360" height="54" rx="8" fill="#232831" stroke="#3a4250"/>
    <circle cx="82" cy="349" r="7" fill="#ff6b6b"/>
    <text x="100" y="345" fill="#f2f4f7" font-weight="600">Lane A</text>
    <text x="100" y="364" fill="#9aa4b2" font-size="13">Steps (own length) · Seed · Mutate</text>
    <text x="404" y="354" fill="#c8d0db" font-size="13" text-anchor="end">0 to 1</text>
    <rect x="60" y="388" width="360" height="54" rx="8" fill="#232831" stroke="#3a4250"/>
    <circle cx="82" cy="415" r="7" fill="#ffb347"/>
    <text x="100" y="411" fill="#f2f4f7" font-weight="600">Lane B</text>
    <text x="100" y="430" fill="#9aa4b2" font-size="13">Steps (own length) · Seed · Mutate</text>
    <text x="404" y="420" fill="#c8d0db" font-size="13" text-anchor="end">0 to 1</text>
    <rect x="60" y="454" width="360" height="54" rx="8" fill="#232831" stroke="#3a4250"/>
    <circle cx="82" cy="481" r="7" fill="#ffe66d"/>
    <text x="100" y="477" fill="#f2f4f7" font-weight="600">Lane C</text>
    <text x="100" y="496" fill="#9aa4b2" font-size="13">Steps (own length) · Seed · Mutate</text>
    <text x="404" y="486" fill="#c8d0db" font-size="13" text-anchor="end">0 to 1</text>
    <rect x="60" y="520" width="360" height="54" rx="8" fill="#232831" stroke="#3a4250"/>
    <circle cx="82" cy="547" r="7" fill="#6bd490"/>
    <text x="100" y="543" fill="#f2f4f7" font-weight="600">Lane D</text>
    <text x="100" y="562" fill="#9aa4b2" font-size="13">Steps (own length) · Seed · Mutate</text>
    <text x="404" y="552" fill="#c8d0db" font-size="13" text-anchor="end">0 to 1</text>
  </g>
  <rect x="60" y="596" width="360" height="132" rx="8" fill="none" stroke="#3a4250" stroke-dasharray="5 4"/>
  <text x="76" y="618" fill="#f2f4f7" font-size="14" font-weight="600">Mapping</text>
  <text x="142" y="618" fill="#9aa4b2" font-size="12">every sound parameter, lanes add up</text>
  <text x="262" y="636" fill="#ff6b6b" font-size="12" font-weight="600" text-anchor="middle">A</text>
  <text x="302" y="636" fill="#ffb347" font-size="12" font-weight="600" text-anchor="middle">B</text>
  <text x="342" y="636" fill="#ffe66d" font-size="12" font-weight="600" text-anchor="middle">C</text>
  <text x="382" y="636" fill="#6bd490" font-size="12" font-weight="600" text-anchor="middle">D</text>
  <text x="76" y="654" fill="#c8d0db" font-size="12">Feedback</text>
  <circle cx="262" cy="650" r="5.2" fill="#ff6b6b"/>
  <circle cx="302" cy="650" r="1.2" fill="#4a5361"/>
  <circle cx="342" cy="650" r="1.2" fill="#4a5361"/>
  <circle cx="382" cy="650" r="1.2" fill="#4a5361"/>
  <text x="76" y="667" fill="#c8d0db" font-size="12">Strike</text>
