  <rect x="500" y="612" width="740" height="128" rx="10" fill="none" stroke="#3a4250" stroke-dasharray="6 5"/>
  <text x="520" y="638" fill="#f2f4f7" font-size="15" font-weight="600">OUTSIDE THE DEVICE</text>
  <text x="696" y="638" fill="#9aa4b2" font-size="13">existing effects as a preset chain, they make the wash</text>
  <g font-size="14">
    <rect x="770" y="662" width="180" height="54" rx="8" fill="#232831" stroke="#3a4250"/>
    <text x="860" y="694" fill="#f2f4f7" font-weight="600" text-anchor="middle">Delay</text>
    <rect x="530" y="662" width="180" height="54" rx="8" fill="#232831" stroke="#3a4250"/>
    <text x="620" y="694" fill="#f2f4f7" font-weight="600" text-anchor="middle">Dattorro Reverb</text>
  </g>
  <g stroke="#9aa4b2" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M1110 556V689H952"/>
    <path d="M770 689H712"/>
  </g>

  <text x="1240" y="766" fill="#9aa4b2" font-size="12" text-anchor="end">Every value is automatable, automation wins over a fired pattern. Mapping rows are examples.</text>
</svg>
