    <rect x="530" y="310" width="180" height="78" rx="8" fill="#232831" stroke="#3a4250"/>
    <text x="546" y="336" fill="#f2f4f7" font-weight="600">Modulator 2</text>
    <text x="546" y="358" fill="#c8d0db" font-size="13">Ratio · Depth (blend)</text>
    <text x="546" y="376" fill="#9aa4b2" font-size="12">adds overtones, zero is off</text>
    <circle cx="690" cy="330" r="6" fill="#ffb347"/>

    <rect x="770" y="240" width="180" height="92" rx="8" fill="#232831" stroke="#5bc0eb"/>
    <text x="786" y="266" fill="#f2f4f7" font-weight="600">Carrier</text>
    <text x="786" y="288" fill="#c8d0db" font-size="13">Wave · Depth</text>
    <text x="786" y="306" fill="#c8d0db" font-size="13">Strike · Strike Decay</text>
    <text x="786" y="323" fill="#9aa4b2" font-size="12">velocity adds strike</text>
    <circle cx="912" cy="260" r="6" fill="#ffb347"/>
    <circle cx="930" cy="260" r="6" fill="#ffe66d"/>

    <rect x="1010" y="240" width="200" height="92" rx="8" fill="#232831" stroke="#3a4250"/>
    <text x="1026" y="266" fill="#f2f4f7" font-weight="600">Fold</text>
    <text x="1026" y="288" fill="#c8d0db" font-size="13">Amount</text>
    <text x="1026" y="306" fill="#c8d0db" font-size="13">Place: before or after the gate</text>
    <circle cx="1190" cy="260" r="6" fill="#ffe66d"/>

    <rect x="1010" y="392" width="200" height="78" rx="8" fill="#232831" stroke="#3a4250"/>
    <text x="1026" y="418" fill="#f2f4f7" font-weight="600">Low pass gate</text>
    <text x="1026" y="440" fill="#c8d0db" font-size="13">Length · Held share</text>
    <text x="1026" y="457" fill="#c8d0db" font-size="13">level and brightness</text>
    <circle cx="1172" cy="412" r="6" fill="#ff6b6b"/>
    <circle cx="1190" cy="412" r="6" fill="#6bd490"/>

    <rect x="770" y="392" width="180" height="78" rx="8" fill="#232831" stroke="#3a4250"/>
    <text x="786" y="418" fill="#f2f4f7" font-weight="600">Parallel sine</text>
    <text x="786" y="440" fill="#c8d0db" font-size="13">Level</text>
    <text x="786" y="457" fill="#c8d0db" font-size="13">at the pitch or octave below</text>
    <text x="786" y="492" fill="#9aa4b2" font-size="12">takes the gate's level,</text>
    <text x="786" y="507" fill="#9aa4b2" font-size="12">skips filter and fold</text>

    <rect x="1010" y="508" width="200" height="48" rx="8" fill="#232831" stroke="#5bc0eb"/>
    <text x="1110" y="538" fill="#f2f4f7" font-weight="600" text-anchor="middle">Output</text>
  </g>

  <path d="M950 431H962V532" stroke="#9aa4b2" stroke-width="1.5" fill="none"/>
  <path d="M1008 431H975" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
  <text x="979" y="424" fill="#9aa4b2" font-size="11">level</text>
  <g stroke="#9aa4b2" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
